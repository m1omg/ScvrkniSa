name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (core + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install FFmpeg (for the Matroska writer tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test
        run: ./gradlew --no-daemon -Pshrink.android=false :core:test :desktop:test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: "*/build/reports/tests/"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build APK
        env:
          # Optional: without these secrets the APK is signed with the public debug key.
          KEYSTORE_BASE64: ${{ secrets.SHRINK_KEYSTORE_BASE64 }}
          SHRINK_KEYSTORE_PASSWORD: ${{ secrets.SHRINK_KEYSTORE_PASSWORD }}
          SHRINK_KEY_ALIAS: ${{ secrets.SHRINK_KEY_ALIAS }}
          SHRINK_KEY_PASSWORD: ${{ secrets.SHRINK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export SHRINK_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon -Pshrink.android=true :android:assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/*.apk "dist/Shrink-${GITHUB_REF_NAME//\//-}-android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/*.apk

  android-test:
    name: Android app on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its tests
        run: ./gradlew --no-daemon -Pshrink.android=true :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Run the tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -G 16M || true
            ./gradlew --no-daemon -Pshrink.android=true :android:connectedDebugAndroidTest || touch android-tests-failed
            mkdir -p emulator-output && adb pull /sdcard/Pictures/ShrinkTests emulator-output/screenshots || true
            adb logcat -d > emulator-output/logcat.txt || true
            grep -E " (Shrink|AndroidRuntime)[ :]" emulator-output/logcat.txt | tail -n 120 || true
            test ! -f android-tests-failed
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-emulator
          path: |
            emulator-output/
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux-x86_64
          - name: macOS Intel
            os: macos-15-intel
            platform: macosx-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macosx-arm64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm
      - name: Build packages
        shell: bash
        run: ./gradlew --no-daemon -Pshrink.android=false -Pshrink.platform=${{ matrix.platform }} :desktop:jpackage
      - name: Check that the Mac app runs on macOS 12 Monterey
        if: runner.os == 'macOS'
        shell: bash
        run: bash tools/check-macos-version.sh desktop/build/jpackage/out/*.dmg 12.0
      - name: Collect packages
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cd desktop/build/jpackage/out
          tag="${GITHUB_REF_NAME//\//-}"
          case "${{ matrix.platform }}" in
            linux-*)
              dpkg-deb -f *.deb Depends
              cp *.deb "../../../../dist/Shrink-$tag-linux-amd64.deb"
              cp *.rpm "../../../../dist/Shrink-$tag-linux-x86_64.rpm"
              tar -czf "../../../../dist/Shrink-$tag-linux-x86_64.tar.gz" Shrink
              ;;
            macosx-x86_64)
              cp *.dmg "../../../../dist/Shrink-$tag-macos-intel.dmg"
              ;;
            macosx-arm64)
              cp *.dmg "../../../../dist/Shrink-$tag-macos-apple-silicon.dmg"
              ;;
            windows-*)
              7z a "../../../../dist/Shrink-$tag-windows-x64.zip" Shrink > /dev/null
              ;;
          esac
          ls -la ../../../../dist
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
