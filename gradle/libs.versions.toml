[versions]
flatlaf = "3.7.2"
jsvg = "2.2.0"
junit = "5.14.4"
# FFmpeg 7.1 builds from bytedeco. 1.5.11 is the newest release whose macOS
# binaries still target macOS 12 (Monterey); 1.5.12+ need macOS 13 or 15.
bytedecoFfmpeg = "7.1-1.5.11"
agp = "8.13.2"
media3 = "1.11.1"
appcompat = "1.7.1"
material = "1.12.0"
activity = "1.10.1"
recyclerview = "1.4.0"
jump3r = "1.0.5"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
jump3r = { module = "de.sciss:jump3r", version.ref = "jump3r" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
